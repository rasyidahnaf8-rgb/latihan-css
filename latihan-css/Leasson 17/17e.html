<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lesson 17e</title>
    <link rel="stylesheet" href="17e.css" />
  </head>
  <body>
    <div class="top-bar">
      <img
        src="../../lat_image/Facebook_f_logo_(2019).svg"
        alt="logo"
        class="logo"
      />
      <input type="text" class="top-search" placeholder="Search Facebook" />
      <div class="top-icons">
        <img
          src="../../lat_image/home-logo-ireng.png"
          alt="home icon"
          class="top-icon"
        />
        <img
          src="../../lat_image/icon-music.png"
          alt="video icon"
          class="top-icon"
        />
        <img
          src="../../lat_image/pren.png"
          alt="groups icon"
          class="top-icon"
        />
        <img src="avatar-user.jpg" alt="user avatar" class="top-avatar" />
      </div>
    </div>

    <div class="container">
      <div class="left-sidebar">
        <div class="sidebar-item">
          <img
            src="../../lat_image/avatar-1.jpg"
            alt="user avatar"
            class="sidebar-avatar"
          />
          <span>Avinoleum</span>
        </div>
        <div class="sidebar-item">
          <img
            src="../../lat_image/pren.png"
            alt="friends icon"
            class="sidebar-icon"
          />
          <span>Friends</span>
        </div>
        <div class="sidebar-item">
          <img
            src="../../lat_image/marketpalce.png"
            alt="marketplace icon"
            class="sidebar-icon"
          />
          <span>Marketplace</span>
        </div>
        <div class="sidebar-item">
          <img
            src="../../lat_image/pren.png"
            alt="groups icon"
            class="sidebar-icon"
          />
          <span>Groups</span>
        </div>
      </div>

      <div class="feed">
        <div class="create-post">
          <img
            src="../../lat_image/avatar-1.jpg"
            alt="user avatar"
            class="avatar"
          />
          <input type="text" placeholder="What's on your mind?" />
        </div>

        <div class="post">
          <div class="post-header">
            <img
              src="../../lat_image/avatar-1.jpg"
              alt="user avatar"
              class="avatar"
            />
            <div class="post-header-text">
              <p class="name">Avinoleum</p>
              <p class="time">2 hours ago</p>
            </div>
          </div>
          <p class="post-text">Had a great time at the beach today!</p>
          <img
            src="../../lat_image/thumb-7.jpg"
            alt="post image"
            class="post-image"
          />
          <div class="post-stats">123 likes &middot; 12 comments</div>
          <div class="post-actions">
            <span>Like</span>
            <span>Comment</span>
            <span>Share</span>
          </div>
        </div>

        <div class="post">
          <div class="post-header">
            <img
              src="../../lat_image/avatar-2.jpg"
              alt="user avatar"
              class="avatar"
            />
            <div class="post-header-text">
              <p class="name">Caretehyia</p>
              <p class="time">5 hours ago</p>
            </div>
          </div>
          <p class="post-text">Finishing explore Avinoleum</p>
          <div class="post-stats">45 likes &middot; 5 comments</div>
          <div class="post-actions">
            <span>Like</span>
            <span>Comment</span>
            <span>Share</span>
          </div>
        </div>
      </div>

      <div class="right-sidebar">
        <p class="panel-title">Contacts</p>
        <div class="contact-item">
          <img
            src="../../lat_image/avatar-3.jpg"
            alt="contact avatar"
            class="contact-avatar"
          />
          <span>Blessed Maiden</span>
        </div>
        <div class="contact-item">
          <img
            src="../../lat_image/avatar-2.jpg"
            alt="contact avatar"
            class="contact-avatar"
          />
          <span>Caretehyia</span>
        </div>
      </div>
    </div>
  </body>
</html>
