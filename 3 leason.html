<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: black;
        padding: 24px;
      }

      .exercise {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .label {
        display: none;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .uber-btn {
        background-color: black;
        color: white;
        padding: 16px 24px;
        border: 1px solid white;
      }

      .uber-btn:hover {
        opacity: 0.7;
      }

      .amazon-btn {
        background-color: #f0c14b;
        color: black;
        padding: 12px 32px;
        border-radius: 24px;
      }

      .amazon-btn:hover {
        background-color: #f4d078;
      }

      .github-btn {
        background-color: #2da44e;
        color: white;
        padding: 14px 32px;
        border-radius: 6px;
        box-shadow: 0 1px 0 rgba(27, 31, 36, 0.1);
      }

      .github-btn:hover {
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      }

      .bootstrap-btn-primary {
        background-color: #6f42c1;
        color: white;
        padding: 12px 24px;
        border-radius: 6px;
      }

      .bootstrap-btn-primary:hover {
        background-color: #59359a;
      }

      .bootstrap-btn-secondary {
        background-color: white;
        color: #6c757d;
        padding: 12px 24px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }

      .bootstrap-btn-secondary:hover {
        background-color: #6c757d;
        color: white;
      }

      .linkedin-btn-primary {
        background-color: #0a66c2;
        color: white;
        padding: 14px 24px;
        border-radius: 24px;
      }

      .linkedin-btn-primary:hover {
        background-color: #084d92;
      }

      .linkedin-btn-secondary {
        background-color: white;
        color: #0a66c2;
        padding: 14px 24px;
        border-radius: 24px;
        border: 2px solid #0a66c2;
      }

      .linkedin-btn-secondary:hover {
        border-width: 3px;
      }
    </style>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <title>Lesson 3</title>
        <link rel="stylesheet" href="lesson3.css" />
      </head>
      <body>
        <div class="exercise">
          <p class="label">3a. Uber</p>
          <a href="https://www.uber.com" target="_blank" class="btn uber-btn"
            >Request now</a
          >
        </div>

        <div class="exercise">
          <p class="label">3b. Amazon</p>
          <a
            href="https://www.amazon.com"
            target="_blank"
            class="btn amazon-btn"
            >Add to Cart</a
          >
        </div>

        <div class="exercise">
          <p class="label">3c. GitHub</p>
          <a
            href="https://www.github.com"
            target="_blank"
            class="btn github-btn"
            >Sign up</a
          >
        </div>

        <div class="exercise">
          <p class="label">3d. Bootstrap</p>
          <a
            href="https://getbootstrap.com"
            target="_blank"
            class="btn bootstrap-btn-primary"
            >Get started</a
          >
          <a
            href="https://getbootstrap.com"
            target="_blank"
            class="btn bootstrap-btn-secondary"
            >Download</a
          >
        </div>

        <div class="exercise">
          <p class="label">3e. LinkedIn</p>
          <a
            href="https://www.linkedin.com"
            target="_blank"
            class="btn linkedin-btn-primary"
            >Apply on company website</a
          >
          <a
            href="https://www.linkedin.com"
            target="_blank"
            class="btn linkedin-btn-secondary"
            >Save</a
          >
        </div>
      </body>
    </html>
  </body>
</html>
